name: E2E Tests

on:
  push:
    branches: [main, release-*]
    paths:
      - '.github/workflows/**'
      - '.github/actions/**'
      - 'go.mod'
      - 'go.sum'
      - 'Makefile'
      - 'Dockerfile'
      - 'entrypoint.sh'
      - 'broker.go'
      - 'cmd/**'
      - 'internal/**'
      - 'pkg/**'
      - 'sdk/**'
      - 'test/**'
      - 'util/**'
  pull_request:
    branches: [main, release-*]
    paths:
      - '.github/workflows/**'
      - '.github/actions/**'
      - 'go.mod'
      - 'go.sum'
      - 'Makefile'
      - 'Dockerfile'
      - 'entrypoint.sh'
      - 'broker.go'
      - 'cmd/**'
      - 'internal/**'
      - 'pkg/**'
      - 'sdk/**'
      - 'test/**'
      - 'util/**'

jobs:
  standalone-guest-power-loss:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build isolated ext4 guest recovery harness
        run: docker build -f test/power-loss/Dockerfile -t cursus-power-loss .
      - name: Cut guest power and recover every journal rewrite phase
        run: |
          mkdir -p power-loss-results
          docker run --rm -v "$PWD/power-loss-results:/results" cursus-power-loss
      - name: Upload guest recovery transcripts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: standalone-guest-power-loss
          path: power-loss-results
          if-no-files-found: ignore

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.2'
          cache: true

      - name: Run E2E tests
        run: make e2e

      - name: Run E2E benchmark tests
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          RUN_E2E_BENCHMARK: "1"
        run: |
          go test -v -timeout 30m ./test/e2e-benchmark/...
  topic-storage-fault-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.2'
          cache: true

      - name: Run topic storage fault reconciliation E2E
        env:
          RUN_E2E_TOPIC_STORAGE_FAULTS: "1"
        run: |
          go test -v -timeout 20m ./test/e2e-cluster/... -run '^TestTopicStorageFaultReconciliation$' -count=1

      - name: Show fault cluster logs on failure
        if: failure()
        working-directory: test/e2e-cluster
        run: docker compose -f docker-compose.yml -f docker-compose.faults.yml logs --no-color

      - name: Clean fault cluster environment
        if: always()
        working-directory: test/e2e-cluster
        run: docker compose -f docker-compose.yml -f docker-compose.faults.yml down -v --remove-orphans

  distributed-truncate-replica-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.2'
          cache: false

      - name: Run distributed truncate, replica conflict, and consumer offset recovery E2E
        env:
          RUN_E2E_CHAOS: "1"
        run: |
          go test -v -count=1 -timeout 25m ./test/e2e-cluster \
            -run '^Test(DistributedTruncateRecoveryPreservesConsumerOffsetReplication|ReplicaConflictRecoveryAfterPartialAppend|ReplicaRecoveryWithoutLaterEpochBoundary)$'

      - name: Show replica recovery cluster logs on failure
        if: failure()
        working-directory: test/e2e-cluster
        run: docker compose -f docker-compose.yml -f docker-compose.faults.yml logs --no-color

      - name: Clean replica recovery cluster environment
        if: always()
        working-directory: test/e2e-cluster
        run: docker compose -f docker-compose.yml -f docker-compose.faults.yml down -v --remove-orphans

  consumer-cleanup-convergence:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.2'
          cache: false
      - name: Run committed consumer cleanup convergence E2E
        env:
          RUN_E2E_CHAOS: "1"
        run: go test -v -count=1 -timeout 20m ./test/e2e-cluster -run '^TestCommittedConsumerCleanupConvergesOnFollowers$'
      - name: Clean consumer cleanup cluster environment
        if: always()
        working-directory: test/e2e-cluster
        run: docker compose -p cursus-cleanup-e2e -f docker-compose.yml -f docker-compose.consumer-cleanup.yml down -v --remove-orphans

  consumer-cleanup-fault-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.2'
          cache: false
      - name: Run cleanup failover, snapshot and re-registration recovery
        env:
          RUN_E2E_CLEANUP_RECOVERY: "1"
          RUN_E2E_CLEANUP_LARGE: "1"
        run: go test -v -count=1 -timeout 25m ./test/e2e-cluster -run '^(TestCommittedConsumerCleanupSurvivesFailoverAndSnapshot|TestTruncateReregistrationConvergesDelayedFollower)$'
      - name: Show cleanup recovery cluster logs
        if: failure()
        working-directory: test/e2e-cluster
        run: docker compose -p cursus-cleanup-e2e -f docker-compose.yml -f docker-compose.snapshot.yml -f docker-compose.consumer-cleanup.yml -f docker-compose.consumer-cleanup-recovery.yml logs --no-color --tail 300
      - name: Clean cleanup recovery cluster
        if: always()
        working-directory: test/e2e-cluster
        run: docker compose -p cursus-cleanup-e2e -f docker-compose.yml -f docker-compose.snapshot.yml -f docker-compose.consumer-cleanup.yml -f docker-compose.consumer-cleanup-recovery.yml down -v --remove-orphans

  consumer-cleanup-injection:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.2'
          cache: false
      - name: Run committed cleanup acknowledgement and read faults
        env:
          RUN_E2E_CLEANUP_INJECTION: "1"
          RUN_E2E_CLEANUP_LARGE: "1"
        run: go test -v -count=1 -timeout 25m ./test/e2e-cluster -run '^TestCommittedConsumerCleanupLostAcknowledgementAndReadFailure$'
      - name: Show cleanup injection logs
        if: failure()
        working-directory: test/e2e-cluster
        run: docker compose -p cursus-cleanup-e2e -f docker-compose.yml -f docker-compose.faults.yml -f docker-compose.consumer-cleanup.yml logs --no-color --tail 300
      - name: Clean cleanup injection cluster
        if: always()
        working-directory: test/e2e-cluster
        run: docker compose -p cursus-cleanup-e2e -f docker-compose.yml -f docker-compose.faults.yml -f docker-compose.consumer-cleanup.yml down -v --remove-orphans

  consumer-cleanup-contract-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.2'
          cache: false
      - name: Verify invalid evidence and subscription rejection
        env:
          RUN_E2E_CLEANUP_REJECTION: "1"
          CURSUS_CLEANUP_PORT_OFFSET: "33000"
        run: go test -v -count=1 -timeout 20m ./test/e2e-cluster -run '^(TestConsumerCleanupRejectsInvalidEvidenceOnThreeBrokers|TestTopicLifecycleRejectsSubscriptionsOnThreeBrokers)$'
      - name: Measure complete live truncate recovery with foreground traffic
        env:
          RUN_E2E_CLEANUP_PROFILE: "1"
          CURSUS_CLEANUP_PORT_OFFSET: "33000"
          CURSUS_CLEANUP_PROFILE_OUTPUT: ${{ runner.temp }}/cleanup-profile.json
        run: go test -v -count=1 -timeout 15m ./test/e2e-cluster -run '^TestTruncateRecoveryCostWithForegroundTraffic$'
      - name: Summarize recovery counters
        run: python3 test/e2e-cluster/analyze_cleanup_profile.py "${{ runner.temp }}/cleanup-profile.json" > "${{ runner.temp }}/cleanup-profile-summary.json"
      - name: Preserve raw recovery measurements
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cleanup-recovery-profile
          path: ${{ runner.temp }}/cleanup-profile*.json
          if-no-files-found: warn
      - name: Verify departed-member reservation protects lifecycle during recovery
        env:
          RUN_E2E_CHAOS: "1"
          CURSUS_CLEANUP_PORT_OFFSET: "33000"
        run: go test -v -count=1 -timeout 15m ./test/e2e-cluster -run '^TestPreparedOffsetsRecoverAfterMemberDepartureAndCoordinatorFailure$'

  raft-snapshot-restore:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.2'
          cache: false

      - name: Run Raft snapshot restore E2E
        env:
          RUN_E2E_RAFT_SNAPSHOT: "1"
        run: |
          go test -v -count=1 -timeout 20m ./test/e2e-cluster \
            -run '^TestRaftSnapshotRestorePreservesAndAdvancesTopicState$'

      - name: Show Raft snapshot compose logs
        if: failure()
        working-directory: test/e2e-cluster
        run: |
          docker compose -p cursus-snapshot-e2e \
            -f docker-compose.yml -f docker-compose.snapshot.yml \
            logs --no-color

      - name: Clean up Raft snapshot compose
        if: always()
        working-directory: test/e2e-cluster
        run: |
          docker compose -p cursus-snapshot-e2e \
            -f docker-compose.yml -f docker-compose.snapshot.yml \
            down -v --remove-orphans

  clean-bootstrap-rolling-restart:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.2'
          cache: false

      - name: Run clean-bootstrap rolling-restart recovery E2E
        env:
          RUN_E2E_ROLLING_RESTART: "1"
        run: |
          go test -v -count=1 -timeout 25m ./test/e2e-cluster \
            -run '^TestCleanBootstrapRollingRestartRestoresFullISR$'

      - name: Show rolling-restart cluster logs
        if: failure()
        working-directory: test/e2e-cluster
        run: docker compose -f docker-compose.yml logs --no-color

      - name: Clean rolling-restart cluster environment
        if: always()
        working-directory: test/e2e-cluster
        run: docker compose -f docker-compose.yml down -v --remove-orphans

  retained-bootstrap-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.2'
          cache: false
      - name: Verify retained bootstrap, interrupted installation and index rebuild
        env:
          RUN_E2E_RETAINED_BOOTSTRAP: "1"
        run: |
          go test -v -count=1 -timeout 30m ./test/e2e-cluster \
            -run '^Test(RetainedBootstrap(RestoresOfflineReplicaWithoutDeletingData|ResumesAfterProcessCrashDuringInstall)|IndexedRecoveryBoundsLargeLegacyTailOnThreeNodes)$'
      - name: Show retained recovery logs
        if: failure()
        working-directory: test/e2e-cluster
        run: docker compose -f docker-compose.yml -f docker-compose.recovery.yml logs --no-color
      - name: Clean retained recovery cluster
        if: always()
        working-directory: test/e2e-cluster
        run: docker compose -f docker-compose.yml -f docker-compose.recovery.yml down -v --remove-orphans

  distributed-compaction-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.2'
          cache: false

      - name: Run distributed compaction E2E
        env:
          RUN_E2E_DISTRIBUTED_COMPACTION: "1"
        run: |
          go test -v -count=1 -timeout 20m ./test/e2e-cluster \
            -run '^TestDistributedCompactionPreservesReplicaAndConsumerOffsets$'

      - name: Show distributed compaction cluster logs
        if: failure()
        working-directory: test/e2e-cluster
        run: |
          docker compose -f docker-compose.yml -f docker-compose.compaction.yml \
            logs --no-color

      - name: Clean distributed compaction cluster environment
        if: always()
        working-directory: test/e2e-cluster
        run: |
          docker compose -f docker-compose.yml -f docker-compose.compaction.yml \
            down -v --remove-orphans

  consumer-history-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.2'
          cache: false
      - name: Verify certified history removal and cache-miss recovery
        env:
          RUN_E2E_CONSUMER_HISTORY: "1"
          CURSUS_CLEANUP_PORT_OFFSET: "31000"
        run: |
          go test -v -count=1 -timeout 25m ./test/e2e-cluster \
            -run '^TestConsumerHistoryCompactionRecovery$'
      - name: Clean isolated consumer history cluster
        if: always()
        working-directory: test/e2e-cluster
        run: |
          docker compose -p cursus-truncate-31000-e2e \
            -f docker-compose.yml -f docker-compose.consumer-history.yml down -v --remove-orphans

  consumer-history-scaling:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.2'
          cache: false
      - name: Measure fixed-group history scaling and cache-miss recovery
        env:
          RUN_E2E_CONSUMER_HISTORY_MEASURE: "1"
          CURSUS_CLEANUP_PORT_OFFSET: "34000"
          CURSUS_HISTORY_MEASURE_OUTPUT: ${{ runner.temp }}/history-whole-broker.jsonl
        run: go test -v -count=1 -timeout 40m ./test/e2e-cluster -run '^TestConsumerHistoryWholeBrokerLadder$'
      - name: Summarize all available measurement rows
        if: always()
        run: |
          if test -f "${{ runner.temp }}/history-whole-broker.jsonl"; then
            python3 test/e2e-cluster/summarize_history_measure.py "${{ runner.temp }}/history-whole-broker.jsonl"
          fi
      - name: Preserve complete and failed scaling measurements
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: consumer-history-scaling
          path: ${{ runner.temp }}/history-whole-broker.*
          if-no-files-found: warn
      - name: Clean isolated history scaling cluster
        if: always()
        working-directory: test/e2e-cluster
        run: |
          docker compose -p cursus-truncate-34000-e2e \
            -f docker-compose.yml -f docker-compose.consumer-history.yml \
            -f docker-compose.history-measure.yml down -v --remove-orphans

  consumer-history-replay-crash:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.2'
          cache: false
      - name: Verify fault accounting and repeated source reads
        run: |
          python3 -m py_compile test/e2e-cluster/history_measure.py test/e2e-cluster/summarize_history_measure.py
          python3 -m unittest discover -s test/e2e-cluster -p 'test_history_measurement_summary.py'
          go test -tags=e2e_faults -race -count=1 ./pkg/metrics ./pkg/controller \
            -run 'TestRecoveryWorkSnapshotForFault|TestConsumerReplayCountsRepeatedPartialReads'
      - name: Account for every interrupted replay process
        env:
          RUN_E2E_CONSUMER_HISTORY_REPLAY_CRASH: "1"
          CURSUS_CLEANUP_PORT_OFFSET: "32000"
          CURSUS_HISTORY_REPLAY_CRASH_OUTPUT: ${{ runner.temp }}/history-replay-crash.jsonl
        run: go test -v -count=1 -timeout 25m ./test/e2e-cluster -run '^TestConsumerHistoryReplayCrashResources$'
      - name: Preserve replay process measurements
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: consumer-history-replay-crash
          path: ${{ runner.temp }}/history-replay-crash.jsonl
          if-no-files-found: warn
      - name: Clean isolated replay fault cluster
        if: always()
        working-directory: test/e2e-cluster
        run: |
          docker compose -p cursus-truncate-32000-e2e \
            -f docker-compose.yml -f docker-compose.consumer-history.yml \
            -f docker-compose.history-measure.yml -f docker-compose.history-replay-crash.yml \
            down -v --remove-orphans

  cluster-failure-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.2'
          cache: true

      - name: Run deterministic Raft failure E2E
        env:
          RUN_E2E_CLUSTER_FAILURE: "1"
        run: |
          go test -v -timeout 20m ./test/e2e-cluster/... -run '^TestRaftLeaderFailoverPropagatesDirectTopicMutations$' -count=1

      - name: Run consumer lifecycle observability E2E
        run: |
          go test -v -timeout 20m ./test/e2e-cluster/... -run '^TestConsumerLifecycleMetricsAcrossThreeBrokerCluster$' -count=1

      - name: Run durable group coordinator failover E2E
        env:
          RUN_E2E_GROUP_COORDINATOR_FAILOVER: "1"
        run: |
          go test -v -timeout 20m ./test/e2e-cluster/... -run '^TestGroupCoordinatorFailoverUsesDurableMembership$' -count=1

      - name: Show cluster logs on failure
        if: failure()
        working-directory: test/e2e-cluster
        run: docker compose -f docker-compose.yml logs --no-color

      - name: Clean cluster environment
        if: always()
        working-directory: test/e2e-cluster
        run: docker compose -f docker-compose.yml down -v --remove-orphans

  cooperative-broker-go:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.2'
          cache: true
      - name: Verify cooperative broker and Go client fault recovery
        env:
          RUN_E2E_COOPERATIVE: "1"
        run: |
          set -o pipefail
          go test -v -timeout 20m ./test/e2e-cluster -run '^TestCooperativeBrokerGoFaultRecovery$' -count=1 | tee cooperative-go.log
      - name: Upload fault recovery measurements
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cooperative-broker-go
          path: cooperative-go.log
          if-no-files-found: ignore
