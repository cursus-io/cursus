name: Unit Tests

on:
  push:
    branches: [main, release-*]
    paths:
      - '.github/workflows/**'
      - '.github/actions/**'
      - 'go.mod'
      - 'go.sum'
      - 'Makefile'
      - 'Dockerfile'
      - 'entrypoint.sh'
      - 'broker.go'
      - 'cmd/**'
      - 'internal/**'
      - 'pkg/**'
      - 'sdk/**'
      - 'test/**'
      - 'util/**'
      - 'codecov.yml'
  pull_request:
    branches: [main, release-*]
    paths:
      - '.github/workflows/**'
      - '.github/actions/**'
      - 'go.mod'
      - 'go.sum'
      - 'Makefile'
      - 'Dockerfile'
      - 'entrypoint.sh'
      - 'broker.go'
      - 'cmd/**'
      - 'internal/**'
      - 'pkg/**'
      - 'sdk/**'
      - 'test/**'
      - 'util/**'
      - 'codecov.yml'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.2'
          cache: true
      - run: make lint

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.2'
          cache: true
      - name: Run tests with coverage
        run: make coverage
      # The TCP fixture lives in pkg/server; default package coverage omits
      # the SDK and controller code exercised through that real Wire connection.
      - name: Measure cooperative Wire integration coverage
        run: >-
          go test -race -covermode=atomic
          -coverpkg=./pkg/controller,./pkg/coordinator,./pkg/protocol,./sdk
          -coverprofile=cooperative-runtime-coverage.out
          ./pkg/server -run '^TestCooperative' -count=1 -timeout 180s
      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.out,./cooperative-runtime-coverage.out
          token: ${{ secrets.CODECOV_TOKEN }}

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.2'
          cache: true
      - run: make build

  command-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.2'
          cache: true
      - name: Run command package tests with race detection
        run: go test -race ./cmd/...
      - name: Recover standalone broker after every journal rewrite phase
        run: go test -tags=e2e_faults -race -count=1 ./cmd/broker -run '^TestStandaloneBrokerTruncateJournalCrashRecovery$'
