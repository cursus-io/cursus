services:
  broker-1:
    build:
      context: ../..
      dockerfile: Dockerfile
    container_name: broker-1
    command: ./broker
    environment:
      - CONFIG_PATH=/app/config.yaml
      - ADVERTISED_HOST=broker-1
      - ADVERTISED_CLIENT_HOST=localhost
      - ADVERTISED_BROKER_PORT=9001
      - RAFT_PORT=9001
      - DISCOVERY_PORT=8000
      - ENABLE_EXPORTER=true
      - EXPORTER_PORT=9100
      - BOOTSTRAP_CLUSTER=true
      - TRANSACTION_TIMEOUT_MS=5000
    ports:
      - "9001:9000"
      - "8000:8000"
      - "9081:9080"
      - "9101:9100"
      - "127.0.0.1:19001:19000"
    volumes:
      - ../cluster/config.yaml:/app/config.yaml
      # Preserve Raft and topic logs across docker stop/start. Each broker
      # needs its own durable store; sharing one would corrupt Raft state.
      - broker-1-data:/app/cluster-logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9080/ready"]
      interval: 3s
      timeout: 1s
      retries: 3
    networks:
      - cluster_network

  broker-2:
    build:
      context: ../..
      dockerfile: Dockerfile
    container_name: broker-2
    command: ./broker
    environment:
      - CONFIG_PATH=/app/config.yaml
      - ADVERTISED_HOST=broker-2
      - ADVERTISED_CLIENT_HOST=localhost
      - ADVERTISED_BROKER_PORT=9002
      - RAFT_PORT=9001
      - DISCOVERY_PORT=8000
      - ENABLE_EXPORTER=true
      - EXPORTER_PORT=9100
      - BOOTSTRAP_CLUSTER=true
      - TRANSACTION_TIMEOUT_MS=5000
    ports:
      - "9002:9000"
      - "8001:8000"
      - "9082:9080"
      - "9102:9100"
      - "127.0.0.1:19002:19000"
    volumes:
      - ../cluster/config.yaml:/app/config.yaml
      - broker-2-data:/app/cluster-logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9080/ready"]
      interval: 3s
      timeout: 1s
      retries: 3
    depends_on:
      broker-1:
        condition: service_started
    networks:
      - cluster_network

  broker-3:
    build:
      context: ../..
      dockerfile: Dockerfile
    container_name: broker-3
    command: ./broker
    environment:
      - CONFIG_PATH=/app/config.yaml
      - ADVERTISED_HOST=broker-3
      - ADVERTISED_CLIENT_HOST=localhost
      - ADVERTISED_BROKER_PORT=9003
      - RAFT_PORT=9001
      - DISCOVERY_PORT=8000
      - ENABLE_EXPORTER=true
      - EXPORTER_PORT=9100
      - BOOTSTRAP_CLUSTER=true
      - TRANSACTION_TIMEOUT_MS=5000
    ports:
      - "9003:9000"
      - "8002:8000"
      - "9083:9080"
      - "9103:9100"
      - "127.0.0.1:19003:19000"
    volumes:
      - ../cluster/config.yaml:/app/config.yaml
      - broker-3-data:/app/cluster-logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9080/ready"]
      interval: 3s
      timeout: 1s
      retries: 3
    depends_on:
      broker-1:
        condition: service_started
    networks:
      - cluster_network

networks:
  cluster_network:
    name: cluster_network

volumes:
  broker-1-data:
  broker-2-data:
  broker-3-data:
