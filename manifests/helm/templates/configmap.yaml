{{- if not (has .Values.performanceProfile (list "low-latency" "balanced" "high-throughput")) }}
{{- fail "performanceProfile must be low-latency, balanced, or high-throughput; use performance.custom for overrides" }}
{{- end }}
{{- $performance := mergeOverwrite (deepCopy (index .Values.performance .Values.performanceProfile)) .Values.performance.custom }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "cursus.fullname" . }}-config
data:
  config.yaml: |
    log_level: {{ .Values.logLevel | default "info" }}
    log_dir: {{ .Values.persistence.logDir.path }} 

    disk_flush_batch_size: {{ $performance.diskFlushBatchSize }}
    linger_ms: {{ $performance.lingerMS }}
    channel_buffer_size: {{ $performance.channelBufferSize }}
    partition_channel_buffer_size: {{ $performance.partitionChannelBufSize }}
    consumer_channel_buffer_size: {{ $performance.consumerChannelBufSize }}
