replicaCount: 1

image:
  repository: ghcr.io/cursus-io/cursus
  tag: "0.2.0"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 9000
  healthPort: 9080
  metricsPort: 9100

persistence:
  enabled: true
  # Leave storageClass empty to use the cluster's default StorageClass.
  storageClass: ""
  # Set classless to true only for a pre-provisioned, classless PersistentVolume.
  classless: false
  config:
    path: /app/config.yaml
    size: 1Gi
  logDir:
    path: /data/logs
    size: 10Gi

tls:
  enabled: false
  secretName: cursus-tls
  certPath: /app/tls/cert.pem
  keyPath: /app/tls/key.pem

clientSecurity:
  # Production installs require TLS and SASL. Set allowInsecure only for an
  # isolated development namespace.
  allowInsecure: false
  sasl:
    secretName: ""
    secretKey: users

podSecurityContext:
  fsGroup: 1000
  supplementalGroups: [1000]

securityContext:
  runAsNonRoot: true
  runAsUser: 1000

serviceAccount:
  create: true
  name: ""

logLevel: info
broker:
  config:
    logLevel: {}

limits:
  maxTopics: 10000
  maxPartitionsPerTopic: 1024
  maxPartitions: 100000
  maxTransactions: 100000
  maxTransactionRecords: 10000
  maxTransactionBytes: 67108864
  maxTransactionOffsets: 10000
  maxInflightRequests: 256
  maxInflightRequestBytes: 268435456

storage:
  minFreeBytes: 268435456
  minFreePercent: 5

nodeSelector: {}
affinity: {}
resources:
  requests:
    cpu: 250m
    memory: 512Mi
tolerations: []
terminationGracePeriodSeconds: 60
startupProbeFailureThreshold: 30


monitoring:
  enabled: false
  # Add labels required by the Prometheus Operator's ServiceMonitor and
  # PrometheusRule selectors (for example, release: kube-prometheus-stack).
  labels: {}
  serviceMonitor:
    enabled: true
    interval: 30s
    scrapeTimeout: 10s
  prometheusRule:
    enabled: true
    brokerNotReadyFor: 5m
    storagePendingFor: 10m
    transactionOldestSeconds: 300
    consumerLag: 10000
  grafanaDashboard:
    enabled: true
    # Grafana's dashboard sidecar selects ConfigMaps carrying this label by default.
    labels:
      grafana_dashboard: "1"

performanceProfile: balanced  
  
performance:  
  custom: {} 
  
  low-latency:  
    diskFlushBatchSize: 50  
    lingerMS: 10  
    channelBufferSize: 1000  
    partitionChannelBufSize: 2000  
    consumerChannelBufSize: 500  
      
  balanced:  
    diskFlushBatchSize: 500  
    lingerMS: 100  
    channelBufferSize: 1024  
    partitionChannelBufSize: 10000  
    consumerChannelBufSize: 1000  
      
  high-throughput:  
    diskFlushBatchSize: 2000  
    lingerMS: 500  
    channelBufferSize: 50000  
    partitionChannelBufSize: 50000  
    consumerChannelBufSize: 5000
