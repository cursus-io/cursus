{{- if ne (int .Values.cluster.minInSyncReplicas) 2 }}
{{- fail "cluster.minInSyncReplicas must remain 2 for the fixed three-member topology" }}
{{- end }}
{{- if ne (int .Values.cluster.defaultReplicationFactor) 3 }}
{{- fail "cluster.defaultReplicationFactor must remain 3 for the fixed three-member topology" }}
{{- end }}
{{- if not .Values.cluster.internalAuthSecret }}
{{- fail "cluster.internalAuthSecret must name a pre-created Secret containing the shared token" }}
{{- end }}
{{- if not .Values.internalTLS.secretName }}
{{- fail "internalTLS.secretName must name a pre-created Secret containing tls.crt, tls.key, and ca.crt" }}
{{- end }}
{{- if not (.Values.cluster.internalAuthGeneration | toString | trim) }}
{{- fail "cluster.internalAuthGeneration must identify the active non-secret credential generation" }}
{{- end }}
{{- if not (regexMatch "^[0-9a-fA-F]{40}$" (.Values.image.revision | toString)) }}
{{- fail "image.revision must be the 40-character source commit embedded in the broker image" }}
{{- end }}
{{- if .Values.image.digest }}
{{- if not (regexMatch "^sha256:[0-9a-fA-F]{64}$" (.Values.image.digest | toString)) }}
{{- fail "image.digest must be a sha256 OCI image digest" }}
{{- end }}
{{- else if not .Values.image.allowMutableTag }}
{{- fail "image.digest is required for production; mutable image tags require image.allowMutableTag=true for source-built validation only" }}
{{- else if not (.Values.image.tag | toString | trim) }}
{{- fail "image.tag is required when image.allowMutableTag=true" }}
{{- end }}
{{- if ne (.Values.compatibility.wireProtocol | toString) "2" }}
{{- fail "compatibility.wireProtocol must remain 2 for this chart" }}
{{- end }}
{{- if ne (.Values.compatibility.brokerProtocol | toString) "4" }}
{{- fail "compatibility.brokerProtocol must remain 4 for this chart" }}
{{- end }}
{{- if ne (.Values.compatibility.snapshotFormat | toString) "10" }}
{{- fail "compatibility.snapshotFormat must remain 10 for this chart" }}
{{- end }}
{{- if ne (.Values.compatibility.recordFormat | toString) "CDM4" }}
{{- fail "compatibility.recordFormat must remain CDM4 for this chart" }}
{{- end }}
{{- $statefulSetName := include "cursus-cluster.fullname" . }}
{{- with (lookup "apps/v1" "StatefulSet" .Release.Namespace $statefulSetName) }}
{{- $claim := index .spec.volumeClaimTemplates 0 }}
{{- $installedSize := index $claim.spec.resources.requests "storage" | toString }}
{{- $requestedSize := $.Values.persistence.size | toString }}
{{- if ne $installedSize $requestedSize }}
{{- fail (printf "persistence.size is install-only during a normal Helm upgrade (installed=%s requested=%s); run scripts/expand-helm-cluster-storage.sh before upgrading other release settings" $installedSize $requestedSize) }}
{{- end }}
{{- end }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $statefulSetName }}
  labels:
    {{- include "cursus-cluster.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "cursus-cluster.headlessService" . }}
  replicas: 3
  # The bootstrap ordinal starts as a sole Raft voter and admits the other
  # replicas after it becomes leader, so all Pods may start in parallel.
  podManagementPolicy: Parallel
  updateStrategy:
    type: OnDelete
  selector:
    matchLabels:
      {{- include "cursus-cluster.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "cursus-cluster.selectorLabels" . | nindent 8 }}
      annotations:
        cursus.io/internal-credential-generation: {{ .Values.cluster.internalAuthGeneration | quote }}
    spec:
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      initContainers:
        - name: verify-image-contract
          image: {{ include "cursus-cluster.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/app/broker", "--verify-deployment-contract"]
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          env:
            - name: EXPECTED_IMAGE_REVISION
              value: {{ .Values.image.revision | quote }}
            - name: EXPECTED_WIRE_PROTOCOL
              value: {{ .Values.compatibility.wireProtocol | quote }}
            - name: EXPECTED_BROKER_PROTOCOL
              value: {{ .Values.compatibility.brokerProtocol | quote }}
            - name: EXPECTED_SNAPSHOT_FORMAT
              value: {{ .Values.compatibility.snapshotFormat | quote }}
            - name: EXPECTED_RECORD_FORMAT
              value: {{ .Values.compatibility.recordFormat | quote }}
      containers:
        - name: broker
          image: {{ include "cursus-cluster.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/bin/sh", "-ec"]
          args:
            - |
              case "${POD_NAME##*-}" in
                0) export BOOTSTRAP_CLUSTER=true BOOTSTRAP_SOLE_VOTER=true ;;
                *) export BOOTSTRAP_CLUSTER=false BOOTSTRAP_SOLE_VOTER=false ;;
              esac
              exec /app/broker
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: broker
              containerPort: {{ .Values.service.brokerPort }}
            - name: health
              containerPort: {{ .Values.service.healthPort }}
            - name: metrics
              containerPort: {{ .Values.service.metricsPort }}
            - name: internal
              containerPort: {{ .Values.service.internalPort }}
            - name: raft
              containerPort: {{ .Values.service.raftPort }}
            - name: discovery
              containerPort: {{ .Values.service.discoveryPort }}
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: ADVERTISED_HOST
              value: "$(POD_NAME).{{ include "cursus-cluster.headlessService" . }}.$(POD_NAMESPACE).svc.cluster.local"
            - name: BROKER_PORT
              value: {{ .Values.service.brokerPort | quote }}
            - name: HEALTH_CHECK_PORT
              value: {{ .Values.service.healthPort | quote }}
            - name: EXPORTER_PORT
              value: {{ .Values.service.metricsPort | quote }}
            - name: ADVERTISED_CLIENT_HOST
              value: "$(POD_NAME).{{ include "cursus-cluster.headlessService" . }}.$(POD_NAMESPACE).svc.cluster.local"
            - name: ENABLE_DISTRIBUTION
              value: "true"
            - name: INTERNAL_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.cluster.internalAuthSecret }}
                  key: {{ .Values.cluster.internalAuthSecretKey }}
            - name: INTERNAL_AUTH_TOKEN_NEXT
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.cluster.internalAuthSecret }}
                  key: {{ .Values.cluster.internalAuthNextSecretKey }}
                  optional: true
            - name: INTERNAL_AUTH_GENERATION
              value: {{ .Values.cluster.internalAuthGeneration | quote }}
            - name: INTERNAL_BROKER_PORT
              value: "{{ .Values.service.internalPort }}"
            - name: RAFT_PORT
              value: "{{ .Values.service.raftPort }}"
            - name: DISCOVERY_PORT
              value: "{{ .Values.service.discoveryPort }}"
            - name: STATIC_CLUSTER_MEMBERS
              value: {{ include "cursus-cluster.members" . | quote }}
            - name: MIN_INSYNC_REPLICAS
              value: "{{ .Values.cluster.minInSyncReplicas }}"
            - name: DEFAULT_REPLICATION_FACTOR
              value: "{{ .Values.cluster.defaultReplicationFactor }}"
            - name: MAX_TOPICS
              value: {{ .Values.limits.maxTopics | quote }}
            - name: MAX_PARTITIONS_PER_TOPIC
              value: {{ .Values.limits.maxPartitionsPerTopic | quote }}
            - name: MAX_PARTITIONS
              value: {{ .Values.limits.maxPartitions | quote }}
            - name: TRANSACTION_COORDINATOR_SHARDS
              value: "{{ .Values.cluster.transactionCoordinatorShards }}"
            - name: LOG_DIR
              value: /data/logs
            - name: USE_TLS
              value: "false"
            - name: INTERNAL_USE_TLS
              value: "true"
            - name: INTERNAL_TLS_CERT_PATH
              value: /app/internal-tls/tls.crt
            - name: INTERNAL_TLS_KEY_PATH
              value: /app/internal-tls/tls.key
            - name: INTERNAL_TLS_CA_PATH
              value: /app/internal-tls/ca.crt
            - name: INTERNAL_TLS_SERVER_NAME
              value: {{ .Values.internalTLS.serverName | quote }}
          startupProbe:
            httpGet:
              path: /ready
              port: health
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: {{ .Values.startupProbeFailureThreshold }}
          readinessProbe:
            httpGet:
              path: /ready
              port: health
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /live
              port: health
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
          volumeMounts:
            - name: logs
              mountPath: /data/logs
            - name: internal-tls
              mountPath: /app/internal-tls
              readOnly: true
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: internal-tls
          secret:
            secretName: {{ .Values.internalTLS.secretName }}
            items:
              - key: tls.crt
                path: tls.crt
              - key: tls.key
                path: tls.key
              - key: ca.crt
                path: ca.crt
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- else }}
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  {{- include "cursus-cluster.selectorLabels" . | nindent 18 }}
              topologyKey: kubernetes.io/hostname
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  volumeClaimTemplates:
    - metadata:
        name: logs
      spec:
        accessModes:
          {{- toYaml .Values.persistence.accessModes | nindent 10 }}
        {{- with .Values.persistence.storageClass }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.size }}
