# Broker Settings
broker_addrs:
  - "localhost:9000"

# Topic Settings
topic: "example-topic"
partitions: 1

# Publisher Settings
acks: "all"
enable_idempotence: true
batch_size: 1
linger_ms: 0

# Consumer Settings
group_id: "example-group"
consumer_id: "example-consumer-1"
mode: "streaming"
auto_commit_interval: "1s"
handler_max_retries: 3
handler_retry_backoff: "100ms"
handler_retry_max_backoff: "1s"
